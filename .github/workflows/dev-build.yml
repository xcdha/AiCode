name: Dev Build

# push 到 dev、换基座分支或上游同步分支时自动构建 arm64 Release APK，产物上传到 Actions Artifacts。
# 用途：日常验证不再需要本地 Gradle 构建（本地是 aarch64 容器，编译一次要十几分钟且占满 CPU）。
# 正式发版走 android-release.yml（打 v* tag），这里只出可安装的验证包，不创建 Release。
on:
  push:
    branches: [ dev, feat/rebase-clean, 'sync/**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# 同一分支连续提交时取消上一次构建，省时间。
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode = git rev-list --count HEAD + 1，浅克隆会算成 1，必须完整历史。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # compileSdk 为 37（miuix 0.9.4 要求）。runner 自带 Android SDK，
      # 直接用其 sdkmanager 补装 platform 37，不额外引入 setup-android action。
      - name: Install SDK platform 37
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          # runner 的 sdkmanager 不在 PATH 里，需要显式定位。
          SM=""
          for p in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                   "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
                   "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SM="$p"; break; fi
          done
          if [ -z "$SM" ]; then
            echo "::error::未找到 sdkmanager，$SDK_ROOT 内容如下"
            ls -la "$SDK_ROOT" 2>/dev/null || true
            exit 1
          fi
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --list 2>/dev/null | grep -E "platforms;android-3[6-9]" | head -20 || true

          # 下载 SDK 偶发 Connection reset，重试三次。
          install_pkg() {
            for i in 1 2 3; do
              if "$SM" --install "$@"; then return 0; fi
              echo "安装失败（第 $i 次），10 秒后重试..."
              sleep 10
            done
            return 1
          }

          # SDK 37 在不同 sdkmanager 里可能叫 android-37 或 android-37.0，先后尝试。
          install_pkg "platforms;android-37.0" "build-tools;36.0.0" \
            || install_pkg "platforms;android-37" "build-tools;36.0.0"
          "$SM" --list_installed | grep -E "platforms;android-3|build-tools" || true

      - name: Restore release keystore & generate signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.AICODE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AICODE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AICODE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AICODE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret $name 为空，请在 Settings → Secrets and variables → Actions 补上"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > app/aicode.jks
          echo "keystore restored ($(stat -c%s app/aicode.jks) bytes)"

          cat > app/keystore.properties <<EOF
          storeFile=aicode.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          if ! keytool -list -keystore app/aicode.jks -storepass "$KEYSTORE_PASSWORD" > /tmp/ks.txt 2>/tmp/ks.err; then
            echo "::error::keystore 打不开：$(cat /tmp/ks.err)"
            exit 1
          fi
          if ! grep -q "^${KEY_ALIAS}," /tmp/ks.txt; then
            echo "::error::keystore 里没有别名 $KEY_ALIAS"
            cat /tmp/ks.txt
            exit 1
          fi
          echo "✓ keystore 校验通过（别名 $KEY_ALIAS）"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build arm64 Release APK
        run: ./gradlew :app:assembleArmsoloRelease --stacktrace

      - name: Rename APK
        run: |
          set -e
          mkdir -p dist
          src="app/build/outputs/apk/armsolo/release/app-armsolo-release.apk"
          [ -f "$src" ] || { echo "::error::未找到 $src"; exit 1; }
          out="dist/Guru-arm64-${GITHUB_SHA::7}.apk"
          cp "$src" "$out"
          echo "packaged $out ($(stat -c%s "$out") bytes)"

      - name: Verify signature
        run: |
          set -e
          apksigner verify --print-certs dist/*.apk | grep -E "SHA-256 digest" | head -1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Guru-arm64-${{ github.sha }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
